<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي عناصر الجدول الدوري</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --primary: #58a6ff;
      --success: #2ea043;
      --danger: #f85149;
      --text: #c9d1d9;
      --border: #30363d;
      --accent: #d29922;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f2937, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 10px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #0d1117;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
    }

    .game-container {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 950px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .prompt-box {
      background: #21262d;
      border: 2px dashed var(--primary);
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #fff;
      text-align: center;
    }

    .level-view {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .level-view.active {
      display: flex;
    }

    /* المستوى الأول - تعديل الاتجاه ليبدأ من اليسار */
    .grid-30 {
      direction: ltr;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 700px;
    }

    .elem-card {
      aspect-ratio: 1;
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s;
    }

    .elem-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .elem-card .symbol {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
    }

    .elem-card .num {
      font-size: 0.65rem;
      color: #8b949e;
    }

    .elem-card.solved {
      background: rgba(46, 160, 67, 0.25);
      border-color: var(--success);
      cursor: default;
      pointer-events: none;
    }

    .elem-card.solved .symbol {
      color: #3fb950;
    }

    /* المستوى الثاني - تعديل الاتجاه ليبدأ من اليسار كجدول حقيقي */
    .periodic-table-wrapper {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 10px;
      direction: ltr;
    }

    .periodic-grid {
      direction: ltr;
      display: grid;
      grid-template-columns: repeat(18, 38px);
      grid-template-rows: repeat(7, 38px);
      gap: 4px;
      margin: 0 auto;
      width: max-content;
    }

    .pt-cell {
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      background: #1c2128;
    }

    .pt-cell.filled {
      background: #232a35;
      color: #8b949e;
    }

    .pt-cell.dropzone {
      background: #11151c;
      border: 1px dashed var(--accent);
      cursor: pointer;
    }

    .pt-cell.dropzone.dragover {
      background: rgba(88, 166, 255, 0.3);
      border-color: var(--primary);
    }

    .pt-cell.solved {
      background: rgba(46, 160, 67, 0.4);
      border-color: var(--success);
      color: #fff;
      font-weight: bold;
    }

    .current-draggable-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .drag-token {
      width: 55px;
      height: 55px;
      background: var(--accent);
      color: #0d1117;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: grab;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      touch-action: none;
    }

    /* المستوى الثالث */
    .states-options {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      justify-content: center;
    }

    .state-btn {
      flex: 1;
      padding: 18px 10px;
      border-radius: 12px;
      background: #21262d;
      border: 2px solid var(--border);
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .state-btn:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }

    .state-btn.solid { border-color: #8b949e; }
    .state-btn.liquid { border-color: #58a6ff; }
    .state-btn.gas { border-color: #d29922; }

    .score-board {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #8b949e;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body>

  <header>
    <h1>تحدي عناصر الجدول الدوري</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchLevel(1)">المستوى 1: تعرّف على الرمز</button>
      <button class="tab-btn" onclick="switchLevel(2)">المستوى 2: ضع العنصر بمكانه</button>
      <button class="tab-btn" onclick="switchLevel(3)">المستوى 3: حالات المادة</button>
    </div>
  </header>

  <div class="game-container">
    <div class="prompt-box" id="prompt-box">جاري التحميل...</div>

    <!-- المستوى الأول -->
    <div id="level-1" class="level-view active">
      <div class="grid-30" id="grid-l1"></div>
      <div class="score-board" id="score-l1"></div>
    </div>

    <!-- المستوى الثاني -->
    <div id="level-2" class="level-view">
      <div class="current-draggable-item">
        <span>العنصر المطلوب وضعه:</span>
        <div id="drag-token" class="drag-token" draggable="true"></div>
      </div>
      <p style="font-size: 0.8rem
